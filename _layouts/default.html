<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f1f4ee">
    <script>
      (function () {
        var saved = localStorage.getItem("sovichea-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      }());
    </script>
    <link rel="icon" href="{{ '/assets/images/typsastra-favicon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% seo %}
    {% feed_meta %}
  </head>
  <body>
    <header class="site-header">
      <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="Sovichea home">S<span>/</span></a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Writing</a>
        <a href="https://github.com/Sovichea/typsastra">Typsastra ↗</a>
        <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
          <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path></svg>
          <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"></path></svg>
        </button>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer">
      <p>Made in Phnom Penh · Built with Jekyll</p>
      <a href="https://github.com/Sovichea">GitHub ↗</a>
    </footer>
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  </body>
</html>
